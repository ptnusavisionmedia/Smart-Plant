# Used only with mosquitto.local.conf (static fallback mode).
# api-bridge: the API's own MQTT connection, full access to all device topics.
user api-bridge
topic readwrite sp/#

# Every other authenticated user is a device, named by its device_uid; %u is
# substituted with the connecting username, so each device is confined to its
# own topic namespace without a per-device ACL entry.
pattern readwrite sp/%u/#
