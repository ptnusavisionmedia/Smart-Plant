# Fallback local-only Mosquitto config: static password_file + acl_file.
# Use this when you don't want to `docker compose build` the mosquitto-go-auth
# plugin. It is NOT wired to the API's /internal/mqtt/auth endpoints, so newly
# claimed devices must be added here manually (see infra/README.md) with:
#
#   docker exec -it smart-plant-mosquitto mosquitto_passwd -b /mosquitto/config/passwd <device_uid> <mqtt_secret>
#
# Switch to this file via:
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.local-simple.yml up -d

listener 1883
protocol mqtt

listener 9001
protocol websockets

persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout

allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl.conf
