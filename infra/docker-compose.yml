name: smart-plant-local

services:
  mosquitto:
    build:
      context: ./mosquitto
      dockerfile: Dockerfile
    container_name: smart-plant-mosquitto
    restart: unless-stopped
    environment:
      API_HTTP_HOST: ${API_HTTP_HOST:-host.docker.internal}
      API_HTTP_PORT: ${API_HTTP_PORT:-3001}
      INTERNAL_MQTT_SHARED_SECRET: ${INTERNAL_MQTT_SHARED_SECRET}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "1883:1883" # plain MQTT, local dev only (no TLS)
      - "9001:9001" # websockets, optional debugging
    volumes:
      - ./mosquitto/mosquitto.conf.template:/mosquitto/config/mosquitto.conf.template:ro
      - ./mosquitto/docker-entrypoint.sh:/mosquitto/docker-entrypoint.sh:ro
      - ./data/mosquitto:/mosquitto/data
      - ./data/mosquitto-log:/mosquitto/log
    entrypoint: ["/bin/sh", "/mosquitto/docker-entrypoint.sh"]
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/#' -C 1 -i healthcheck -W 3 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

networks:
  default:
    name: smart-plant-local
