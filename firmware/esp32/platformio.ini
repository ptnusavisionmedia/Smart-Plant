; PlatformIO Project Configuration File
; Smart Plant Emergency Detector — ESP32 firmware (Module 4 / T-27..T-32)
;
; Environments:
;   esp32dev        - production build: MQTT over TLS (8883) against the real
;                      infra/mosquitto broker (or a hosted equivalent).
;   esp32dev-local   - local development build: MQTT plain TCP (1883) against
;                      the infra/docker-compose.yml Mosquitto on the LAN.
;   esp32dev-wokwi   - Wokwi cloud simulation build: MQTT plain TCP (1883)
;                      against a PUBLIC demo broker, because Wokwi's simulated
;                      WiFi cannot reach localhost:1883. See WOKWI.md.
;   native           - host-side Unity unit tests, no hardware/Arduino.
;
; Switch a real device between brokers by flashing a different environment
; (`pio run -e esp32dev-local -t upload`), or by overriding MQTT_HOST/
; MQTT_PORT/MQTT_USE_TLS with -D on the command line.

[platformio]
default_envs = esp32dev

[common_esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    bblanchon/ArduinoJson@^7.1.0
    knolleary/PubSubClient@^2.8

[env:esp32dev]
; Production: TLS MQTT against the real broker. Placeholder host — override
; per deployment, e.g. `pio run -e esp32dev -D MQTT_HOST='"mqtt.example.com"'`.
extends = common_esp32
build_flags =
    -D SP_BUILD_PRODUCTION=1
    '-D MQTT_HOST="mqtt.smartplant.example.com"'
    -D MQTT_PORT=8883
    -D MQTT_USE_TLS=1
    '-D DEVICE_UID_PREFIX="esp32-"'

[env:esp32dev-local]
; Local dev against infra/docker-compose.yml Mosquitto (no TLS at V1, see
; Tech Spec §1 / §5 "local" environment). Replace with your LAN/host IP.
extends = common_esp32
build_flags =
    -D SP_BUILD_LOCAL=1
    '-D MQTT_HOST="192.168.1.50"'
    -D MQTT_PORT=1883
    -D MQTT_USE_TLS=0
    '-D DEVICE_UID_PREFIX="esp32-"'

[env:esp32dev-wokwi]
; Wokwi simulation demo: public test broker, plain TCP. NOT for production or
; real hardware — see WOKWI.md for why and how to switch back.
extends = common_esp32
build_flags =
    -D WOKWI_DEMO=1
    '-D MQTT_HOST="broker.hivemq.com"'
    -D MQTT_PORT=1883
    -D MQTT_USE_TLS=0
    '-D DEVICE_UID_PREFIX="sp-demo-wokwi-"'

[env:native]
; Host-side unit tests (Unity). No Arduino framework: only pure-logic files
; (control engine decision functions, sensor math helpers) are compiled here.
; Hardware-dependent drivers (WiFi/MQTT/DHT/relay/NVS) are excluded via
; build_src_filter because they include Arduino-only headers.
platform = native
test_framework = unity
test_build_src = yes
build_flags =
    -std=gnu++17
    -D UNIT_TEST
    -I include
    -I src
build_src_filter =
    +<*>
    -<main.cpp>
    -<network/*>
    -<sensors/dht.cpp>
    -<sensors/soil.cpp>
    -<sensors/ultrasonic.cpp>
    -<sensors/float_switch.cpp>
    -<control/pump.cpp>
    -<control/emergency.cpp>
    -<control/config_store.cpp>
